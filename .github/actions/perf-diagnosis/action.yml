name: 'Performance diagnosis'
description: 'Measure the PR preview against production with Lighthouse and comment with performance findings, budgets and fixes.'
author: 'perf-diagnosis'

inputs:
  base-url:
    description: 'Production URL to measure as the baseline.'
    required: true
  pr-url:
    description: "The PR's preview deploy URL (Netlify or Vercel)."
    required: true
  config:
    description: 'Path to perf.config.json inside the repository.'
    required: false
    default: 'perf.config.json'
  github-token:
    description: 'Token used to read and post the PR comment.'
    required: false
    default: ${{ github.token }}
  report-dir:
    description: 'Optional folder (inside the workspace) to save every Lighthouse report, trace and the posted comment.'
    required: false
    default: ''
  api-url:
    description: 'Optional https URL of the pr-ingest endpoint; the result is uploaded when api-url and api-key are both set.'
    required: false
    default: ''
  api-key:
    description: 'Optional project API key (pd_…); pass it from a repo secret such as secrets.PERF_API_KEY.'
    required: false
    default: ''

outputs:
  passed:
    description: 'Whether the performance check passed.'

runs:
  using: node24
  main: dist/index.js
