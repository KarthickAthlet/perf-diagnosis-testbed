name: 'ShipGuard publish'
description: 'The privileged half of the two-workflow setup (0b-4): validates the scan artifact as untrusted input, verifies identity against GitHub, exchanges an OIDC token, diffs against the baseline, posts the ShipGuard comment and check. Runs on workflow_run; never runs PR code.'
author: 'shipguard'

inputs:
  github-token:
    description: 'The workflow token (github.token): reads the run artifact, PRs, files and the compare API; posts the comment and the check run.'
    required: false
    default: ${{ github.token }}
  shipguard-api:
    description: 'The ShipGuard backend base URL (…/functions/v1).'
    required: false
    default: 'https://ietochxecbljqodazkik.supabase.co/functions/v1'
  ingest-key:
    description: 'Optional per-project ingest key (pd_…), the fallback when OIDC is unavailable. Prefer leaving it unset: OIDC needs no stored secret.'
    required: false
    default: ''

outputs:
  outcome:
    description: 'published | unverified | rejected | skipped | scan-failed.'

runs:
  using: node24
  main: dist/index.js
