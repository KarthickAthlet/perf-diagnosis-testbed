# .github/workflows/shipguard-publish.yml — generated by ShipGuard setup (spec 0b-4 §4.2).
#
# PRIVILEGED. Runs the default branch's copy of this file (workflow_run always does), never
# PR code. Validates the scan artifact as untrusted input, verifies identity against GitHub,
# gets a short-lived ShipGuard credential via OIDC, runs the diff, posts the comment and check.
name: ShipGuard publish

on:
  workflow_run:
    workflows: [ShipGuard scan]   # by name; the action also checks the workflow path (trust.ts)
    types: [completed]

permissions:
  contents: read
  actions: read          # download the scan run's artifact
  pull-requests: read    # read the PR (head, base, changed files); NO write
  # no pull-requests / checks WRITE: the comment and check come from the ShipGuard App,
  # posted by the backend (poster: app, spec 1b-1 §4). This job makes no GitHub writes.
  id-token: write        # OIDC → short-lived ShipGuard ingest token (no stored secret)

concurrency:
  group: shipguard-publish-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Check out ONLY the default branch, sparse, just far enough to use the LOCAL publish
      # action bundled in this repo (.github/actions/shipguard-publish). NEVER PR code:
      # `ref` is the repository's default branch, `persist-credentials: false`, and the
      # sparse checkout excludes everything except the action's two files.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 — pinned by SHA (PLAN §9)
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: |
            .github/actions/shipguard-publish

      # NO actions/cache. NO npm install of anything the PR controls. The publish action
      # downloads ONLY the artifact named "shipguard-artifact" from
      # github.event.workflow_run.id via the API, parses it in memory with size limits, and
      # never writes artifact content into shell commands, env files or outputs.
      - name: ShipGuard publish
        uses: ./.github/actions/shipguard-publish
        with:
          github-token: ${{ github.token }}
          shipguard-api: https://ietochxecbljqodazkik.supabase.co/functions/v1
          poster: app
